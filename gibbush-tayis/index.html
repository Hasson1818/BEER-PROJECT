<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>גיבוש טייס · BEER PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- Inside the bus from Ofakim: the windows are closed, so you don't see where you're going. -->
    <div class="backdrop" aria-hidden="true">
      <div class="bus-row"></div>
      <div class="bus-seats"></div>
    </div>
    <div class="tired" aria-hidden="true"></div>
    <div class="eyes" aria-hidden="true"><span>עיניים עצומות</span></div>

    <div id="hud" class="hud" hidden>
      <section class="objective" aria-live="polite">
        <span class="objective-label">משימה</span>
        <p id="objective-text"></p>
        <p id="objective-sub" class="objective-sub" hidden></p>
      </section>

      <section class="status">
        <!-- No watches in the gibbush: only the day and the part of the day. -->
        <div class="clock"><span id="day" class="day">יום 1</span> <span id="clock">בוקר</span></div>
        <div class="tab" id="tab" hidden><span>כותפת</span><strong id="tab-number"></strong></div>
        <div class="gear-hud" id="gear" hidden>
          <span title="קסדה">🪖</span>
          <span title="בקבוק מים">💧</span>
          <button id="booklet-button" type="button" title="חוברת בד״ח (B)">📘 <small>B</small></button>
        </div>
      </section>

      <div class="drill" id="drill" hidden>
        <strong id="drill-title"></strong>
        <span id="drill-info"></span>
      </div>

      <div class="stamina" id="stamina" hidden>
        <span>כוח</span>
        <div class="stamina-track"><div class="stamina-fill" id="stamina-fill"></div></div>
      </div>
      <div class="grip" id="grip" hidden>
        <span>אחיזה</span>
        <div class="stamina-track"><div class="grip-fill" id="grip-fill"></div></div>
      </div>
      <div class="carry" id="carry" hidden></div>

      <div class="crosshair" id="crosshair"></div>
      <div class="prompt" id="prompt" hidden></div>
      <div class="announcement" id="announcement" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <div id="dialogue" class="dialogue" hidden>
      <div class="dialogue-speaker" id="dialogue-speaker"></div>
      <p class="dialogue-text" id="dialogue-text"></p>
      <div class="dialogue-choices" id="dialogue-choices"></div>
      <button class="dialogue-continue" id="dialogue-continue" type="button">המשך ◂</button>
    </div>

    <div id="panel-layer" class="panel-layer" hidden></div>

    <div id="click-to-play" class="click-to-play" hidden>
      <div class="ctp-card">
        <h2>גיבוש טייס</h2>
        <p class="ctp-action">לחצו כדי לשחק</p>
        <ul class="controls-help">
          <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> תנועה · <kbd>Shift</kbd> ריצה</li>
          <li>עכבר · הסתכלות</li>
          <li><kbd>E</kbd> או לחיצה · פעולה / פנייה</li>
          <li><kbd>B</kbd> חוברת בד״ח</li>
          <li><kbd>1</kbd>–<kbd>4</kbd> תשובה</li>
          <li><kbd>Esc</kbd> עצירה</li>
        </ul>
        <a class="ctp-menu" href="../main-screen/">חזרה לתפריט הראשי</a>
      </div>
    </div>

    <div id="touch-controls" class="touch-controls" hidden>
      <div class="joystick" id="joystick"><div class="joystick-knob" id="joystick-knob"></div></div>
      <button class="action-button" id="action-button" type="button">פעולה</button>
      <a class="touch-menu" href="../main-screen/" aria-label="חזרה לתפריט">☰</a>
      <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="מסך מלא">⛶</button>
      <div class="rotate-hint">↻ נוח יותר לשחק כשהטלפון לרוחב</div>
    </div>

    <div id="fade" class="fade"></div>
    <div id="loading" class="loading">
      <div class="loading-card">
        <div class="stamp">חצרים</div>
        <p>נוסעים לגבעת הגיבוש…</p>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
